<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script>
			(function () {
				var standalone = false;
				try {
					standalone =
						(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
						window.navigator.standalone === true;
				} catch (e) {}
				if (!standalone) return;
				var meta = document.querySelector('meta[name="viewport"]');
				if (meta) {
					var content = meta.getAttribute('content') || '';
					if (!/maximum-scale\s*=/i.test(content)) content += ', maximum-scale=1.0';
					if (!/user-scalable\s*=/i.test(content)) content += ', user-scalable=no';
					meta.setAttribute('content', content);
				}
				var prevent = function (event) {
					event.preventDefault();
				};
				document.addEventListener('gesturestart', prevent, { passive: false });
				document.addEventListener('gesturechange', prevent, { passive: false });
				document.addEventListener('gestureend', prevent, { passive: false });
				document.documentElement.setAttribute('data-pl-zoom-lock', '');
			})();
		</script>
		<meta name="theme-color" content="#eef1f4" />
		<title>Offline · Pocket Ledger</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
				background: #09090b;
				color: #fafafa;
				padding: 1.5rem;
				text-align: center;
			}
			p {
				opacity: 0.75;
				max-width: 28rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You’re offline</h1>
			<p>
				Pocket Ledger couldn’t load this page from cache. Open the app once while online, then try
				again.
			</p>
		</main>
	</body>
</html>
