# Local development / preview. Production target is Cloud Run (Spec 118).
#   docker compose up --build
#
# Project name is fixed so Docker Desktop shows "pocket-ledger"
# even when the checkout folder is a worktree (e.g. duz0).
# Dev:     http://localhost:5173
# Preview: docker compose --profile preview up preview

name: pocket-ledger

services:
  dev:
    build: .
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Named volume starts empty — install into it before Vite.
    command:
      - sh
      - -c
      - npm ci && npm run dev -w @pocket-ledger/web -- --host 0.0.0.0 --port 5173

  preview:
    profiles: ['preview']
    build: .
    ports:
      - '4173:4173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci && npm run build -w @pocket-ledger/web && npm run preview -w @pocket-ledger/web -- --host 0.0.0.0 --port 4173

volumes:
  node_modules:
