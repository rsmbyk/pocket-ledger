name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'Dockerfile.api'
      - 'cloudbuild.api.yaml'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip when GCP is not configured
        id: skip
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Set repo variable GCP_PROJECT_ID (and WIF secrets) to deploy Cloud Run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.skip.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.skip.outputs.skip != 'true'
      - name: Build and deploy Cloud Run (API)
        if: steps.skip.outputs.skip != 'true'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
        run: |
          gcloud config set project "$PROJECT_ID"
          REGION="${REGION:-us-central1}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/pocket-ledger-api"
          gcloud builds submit \
            --config cloudbuild.api.yaml \
            --substitutions=_IMAGE="$IMAGE" \
            --timeout=1200s
          WEB_ORIGIN="${WEB_ORIGIN:-https://pocket-ledger-web-w6fanfnuqa-uc.a.run.app}"
          DEPLOY_ARGS=(
            --image "$IMAGE"
            --region "$REGION"
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --cpu=1
            --memory=256Mi
            --cpu-throttling
            --no-cpu-boost
            --quiet
          )
          ENV_VARS="WEB_ORIGIN=${WEB_ORIGIN}"
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            ENV_VARS="${ENV_VARS},GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
          fi
          DEPLOY_ARGS+=(--update-env-vars "$ENV_VARS")
          if [ -n "${CLOUD_SQL_INSTANCE}" ]; then
            DEPLOY_ARGS+=(--add-cloudsql-instances="$CLOUD_SQL_INSTANCE")
            DEPLOY_ARGS+=(--set-secrets=DATABASE_URL=database-url:latest)
          fi
          gcloud run deploy pocket-ledger-api "${DEPLOY_ARGS[@]}"
