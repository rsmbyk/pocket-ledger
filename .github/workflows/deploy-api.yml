name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'Dockerfile.api'
      - 'cloudbuild.api.yaml'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip when GCP is not configured
        id: skip
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Set repo variable GCP_PROJECT_ID (and WIF secrets) to deploy Cloud Run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.skip.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.skip.outputs.skip != 'true'
      - name: Build and deploy Cloud Run (API)
        if: steps.skip.outputs.skip != 'true'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          gcloud config set project "$PROJECT_ID"
          REGION="${REGION:-asia-southeast2}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/pocket-ledger-api"
          gcloud builds submit \
            --config cloudbuild.api.yaml \
            --substitutions=_IMAGE="$IMAGE" \
            --timeout=1200s
          gcloud run deploy pocket-ledger-api \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --quiet
