name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'Dockerfile.web'
      - 'cloudbuild.web.yaml'
      - 'docker/nginx-web.conf'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip when GCP is not configured
        id: skip
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Set repo variable GCP_PROJECT_ID (and WIF secrets) to deploy Cloud Run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.skip.outputs.skip != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.skip.outputs.skip != 'true'
      - name: Build and deploy Cloud Run (web)
        if: steps.skip.outputs.skip != 'true'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          gcloud config set project "$PROJECT_ID"
          REGION="${REGION:-asia-southeast2}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/pocket-ledger-web"
          VITE_API_URL="${VITE_API_URL:-https://pocket-ledger-api-w6fanfnuqa-et.a.run.app}"
          gcloud builds submit \
            --config cloudbuild.web.yaml \
            --substitutions=_IMAGE="$IMAGE",_VITE_API_URL="$VITE_API_URL",_VITE_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --timeout=1200s
          gcloud run deploy pocket-ledger-web \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=256Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --quiet
